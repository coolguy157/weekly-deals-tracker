name: Deploy Giant Lewisburg Deals to GitHub Pages

on:
  schedule:
    # Runs every Friday at 6:00 AM EST (11:00 UTC) when Giant's new weekly circular drops
    - cron: '0 11 * * 5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write # Needed to commit giant_deals.db and push to gh-pages branch

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ingest Weekly Circular into Giant Database
        run: |
          # Sync Lewisburg PA Giant circular (Zip 17837) into isolated database
          python -m src.cli --db data/giant_deals.db sync --store giant

      - name: Export Evaluated Deals for Web Application
        run: |
          # Generate latest web JSON payload with All-Time Low evaluations
          python -m src.cli --db data/giant_deals.db export --store giant --format json --output web/deals.json

      - name: Commit Updated Historical Database to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/giant_deals.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore(data): auto-update Lewisburg Giant deals history [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Deploy Web App to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          commit_message: "deploy: update Lewisburg Giant weekly deals web app"
